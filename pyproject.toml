[project]
name = "garmin-data"
version = "0.1.0"
description = "Local, long-term collection of Garmin Connect training and recovery data (raw JSON + normalized DuckDB tables)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "duckdb>=1.5.5",
    "garminconnect>=0.3.16",
]

[project.scripts]
garmin-data = "garmin_data.cli:main"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
